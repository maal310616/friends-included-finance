<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Friends Included Finance</title><style>:root{--n:#14233b;--g:#e7aa44;--p:#f7f5f0;--l:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--p);font:16px system-ui;color:var(--n)}header{padding:22px max(20px,calc((100% - 1080px)/2));background:var(--n);color:white;display:flex;justify-content:space-between;gap:15px}main{max-width:1080px;margin:auto;padding:30px 20px}.card{background:#fff;border:1px solid var(--l);padding:18px;border-radius:14px}.stats,.cols{display:grid;gap:16px}.stats{grid-template-columns:repeat(3,1fr)}.cols{grid-template-columns:1fr 1fr;margin-top:20px}input,select,textarea,button{font:inherit;padding:9px;border-radius:7px;border:1px solid #ccd4df}label{display:grid;gap:5px;font-size:13px;font-weight:bold}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}button{background:var(--n);color:#fff;border:0;font-weight:bold;cursor:pointer}.money{font-size:28px;font-weight:bold}.record{padding:12px 0;border-top:1px solid var(--l);display:flex;justify-content:space-between}.tag{background:#fff1d7;color:#925a0b;border-radius:99px;padding:4px 8px;font-size:12px;font-weight:bold}.hidden{display:none}@media(max-width:700px){.stats,.cols,.form{grid-template-columns:1fr}header{display:block}}</style><body><header><b>FRIENDS INCLUDED LTD<br><small>Finance operations · Linda M</small></b><label>Demonstration role<select id="role"><option>Richard</option><option>Anastasia</option><option>Jean-Claude</option><option>Kevin</option><option>Svetlana</option></select></label></header><main><h1>Financial dashboard</h1><p>Record sales and expenses, then use Svetlana’s manager controls to approve decisions.</p><section class="stats" id="stats"></section><section class="cols"><div class="card" id="saleBox"><h3>Submit a sale</h3><form id="sale" class="form"><label>Reference<input required name="ref" placeholder="S01" pattern="S[0-9]+"></label><label>Customer<input required name="customer"></label><label>Project<select name="project"><option>A</option><option>B</option></select></label><label>Amount €<input required type="number" name="amount" min=".01" step=".01"></label><label class="full">Description<textarea required name="description"></textarea></label><label>Richard %<input required name="r" value="50" type="number"></label><label>Anastasia %<input required name="a" value="30" type="number"></label><label>Jean-Claude %<input required name="j" value="20" type="number"></label><div class="full"><button>Save for approval</button></div></form></div><div class="card hidden" id="expenseBox"><h3>Submit an expense</h3><form id="expense" class="form"><label>Reference<input required name="ref" placeholder="E01" pattern="E[0-9]+"></label><label>Amount €<input required type="number" name="amount" min=".01" step=".01"></label><label>Allocation<select name="allocation"><option>A</option><option>B</option><option value="overhead">Company overhead</option></select></label><label class="full">Description<textarea required name="description"></textarea></label><div class="full"><button>Save expense</button></div></form></div><div class="card hidden" id="manager"><h3>Manager controls</h3><div id="pending"></div></div><div class="card"><h3>Records</h3><div id="records"></div></div></section></main><script>let data=JSON.parse(localStorage.getItem('fi')||'[]'),fmt=n=>new Intl.NumberFormat('en-IE',{style:'currency',currency:'EUR'}).format(n||0),save=()=>localStorage.setItem('fi',JSON.stringify(data));function render(){let a=0,b=0,ca=0,cb=0,e=0;data.forEach(x=>{if(x.kind==='sale'&&x.status==='Approved'){if(x.project==='A'){a+=x.amount;ca+=x.amount*.1}else{b+=x.amount;cb+=x.amount*.1}}if(x.kind==='expense'&&x.status==='Approved')e+=x.amount});stats.innerHTML=[['Project A',a-ca],['Project B',b-cb],['Company result',a+b-ca-cb-e]].map(x=>`<div class=card><b>${x[0]}</b><div class=money>${fmt(x[1])}</div></div>`).join('');records.innerHTML=data.slice().reverse().map(x=>`<div class=record><span><b>${x.ref}</b><br><small>${x.by} · ${fmt(x.amount)}</small></span><span class=tag>${x.status}</span></div>`).join('')||'No records yet.';pending.innerHTML=data.filter(x=>x.status!=='Approved').map(x=>`<div class=record><span><b>${x.ref}</b><br><small>${x.kind}</small></span><button onclick="approve('${x.ref}')">Approve</button></div>`).join('')||'Nothing waiting.'}function approve(ref){let x=data.find(x=>x.ref===ref);x.status='Approved';save();render()}role.onchange=()=>{let r=role.value;saleBox.classList.toggle('hidden',!['Richard','Anastasia','Jean-Claude'].includes(r));expenseBox.classList.toggle('hidden',r!=='Kevin');manager.classList.toggle('hidden',r!=='Svetlana')};sale.onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(sale));if(+f.r + +f.a + +f.j!==100)return alert('Commission shares must total 100%.');if(data.some(x=>x.ref===f.ref))return alert('Duplicate reference refused.');data.push({kind:'sale',...f,amount:+f.amount,by:role.value,status:'Pending approval'});save();sale.reset();render()};expense.onsubmit=e=>{e.preventDefault();let f=Object.fromEntries(new FormData(expense));if(data.some(x=>x.ref===f.ref))return alert('Duplicate reference refused.');data.push({kind:'expense',...f,amount:+f.amount,by:'Kevin',status:f.allocation==='overhead'?'Approved':'Awaiting allocation'});save();expense.reset();render()};render()</script></body></html>
